<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="container">
        <h1>Student Records</h1>
        <p class="subtitle">A simple summary of student information.</p>

        <section>
            <h2>Marks</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">SN</th>
                            <th scope="col">Full Name</th>
                            <th scope="col">Last Name</th>
                            <th scope="col">Marks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Ram</td>
                            <td>Bhandari</td>
                            <td>80.45</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Shyam</td>
                            <td>Thapa</td>
                            <td>90.45</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>Student Summary</h2>
            <div class="table-wrap">
                <table>
                    <tbody>
                        <tr>
                            <th scope="row">Full Name</th>
                            <td>Ram</td>
                            <td colspan="2">Kanendra Budha</td>
                        </tr>
                        <tr>
                            <th scope="row">Last Name</th>
                            <td colspan="2">Budha</td>
                            <td>Joshi</td>
                        </tr>
                        <tr>
                            <th scope="row">Roll Number</th>
                            <td colspan="2">1</td>
                            <td>2</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4">This is an example student record table.</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
